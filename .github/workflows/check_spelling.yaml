# Check that there is correct spelling in all files
name: Check spelling

# Check spelling on the 12th day of the month.
# 12th as the first letter of this repository is the 12th letter in the alphabet.
on:
  push:
    paths:
      - .github/workflows/check_spelling.yaml
      - "docs/**"
      - .wordlist.txt
      - README.md
  pull_request:
    paths:
      - .github/workflows/check_spelling.yaml
      - "docs/**"
      - .wordlist.txt
      - README.md
  schedule:
    - cron: "0 0 12 * *"

# Suggested by Super Linter
permissions: read-all

jobs:
  check_spelling:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - uses: igsekor/pyspelling-any@v1.0.4
